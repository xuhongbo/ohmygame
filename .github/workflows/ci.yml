name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: bun run changelog:check
      - run: bun run prepare:preinstalled-plugins
      - run: bun run typecheck
      - run: bun run test
      - if: runner.os == 'Linux'
        run: bun run build:renderer
      - run: bun run test:node-runtime
